<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Theorem 1 — JC Maths</title><link rel="stylesheet" href="../../assets/site.css"><style>body{margin:0;background:#f5f7fa;color:#202936;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:980px;margin:auto;padding:26px 18px 60px}h1{font-size:clamp(2.2rem,7vw,4.2rem);margin:.1em 0}.lead{font-size:1.15rem;line-height:1.55;color:#566070}.card{background:#fff;border:1px solid #c9d1dc;border-radius:10px;padding:18px;margin-top:16px}svg{width:100%;background:#fff;border:2px solid #c9d1dc;border-radius:10px;touch-action:none;user-select:none}.line{stroke:#202936;stroke-width:5}.geo-point{stroke:#111;stroke-width:3}.geo-point.selected{stroke:#fff;stroke-width:5}.point-red{fill:#c62828}.point-green{fill:#2e7d32}.touch-target{fill:transparent;stroke:none;pointer-events:all;cursor:grab}.label{font-size:27px;font-weight:900;fill:#202936;paint-order:stroke;stroke:#fff;stroke-width:5px}.note{padding:12px 14px;background:#eef5ff;border-left:6px solid #1565c0;border-radius:8px;line-height:1.5}.math-statement{font-size:clamp(1.3rem,4vw,2rem);font-weight:850;line-height:1.4}button{min-height:46px;padding:9px 13px;border:1px solid #c9d1dc;border-radius:9px;background:#fff;font:inherit;font-weight:800;margin-top:12px}</style></head><body><header class="site-shell"><div class="site-shell-inner"><a class="site-brand" href="../../index.html"><span class="site-logo" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span>JC Maths</span></a><nav class="site-nav"><a href="../../index.html">Home</a><a href="../">Geometry</a></nav></div></header><main><p>Theorem 1</p><h1>Vertically Opposite Angles</h1><p class="lead">Two lines cross. Move the green point to change the angle and watch the opposite angle change with it.</p><div class="card"><svg id="board" viewBox="0 0 900 430"><line id="l1" class="line"></line><line id="l2" class="line"></line><path id="arc1" fill="none" stroke="#1565c0" stroke-width="7"></path><path id="arc2" fill="none" stroke="#1565c0" stroke-width="7"></path><circle id="v" class="geo-point point-red" cx="450" cy="215" r="13"></circle><circle id="h" class="geo-point point-green" cx="700" cy="125" r="13"></circle><circle id="hh" class="touch-target" cx="700" cy="125" r="28"></circle><text id="m1" class="label" x="535" y="180"></text><text id="m2" class="label" x="330" y="275"></text></svg><button id="show">Show theorem</button><div id="statement" class="note" hidden><strong>Theorem 1</strong><div class="math-statement">Vertically opposite angles are equal in measure.</div></div></div></main><script>const svg=document.getElementById('board'),l1=document.getElementById('l1'),l2=document.getElementById('l2'),h=document.getElementById('h'),hh=document.getElementById('hh'),a1=document.getElementById('arc1'),a2=document.getElementById('arc2'),m1=document.getElementById('m1'),m2=document.getElementById('m2');const O={x:450,y:215};let drag=false,p={x:700,y:125};function ang(){return Math.atan2(O.y-p.y,p.x-O.x)}function end(theta,r=600){return{x:O.x+r*Math.cos(theta),y:O.y-r*Math.sin(theta)}}function arc(theta1,theta2,r){const A=end(theta1,r),B=end(theta2,r);return`M ${A.x} ${A.y} A ${r} ${r} 0 0 0 ${B.x} ${B.y}`}function draw(){const t=ang(),opp=t+Math.PI,e1=end(0),e1b=end(Math.PI),e2=end(t),e2b=end(opp);l1.setAttribute('x1',e1b.x);l1.setAttribute('y1',e1b.y);l1.setAttribute('x2',e1.x);l1.setAttribute('y2',e1.y);l2.setAttribute('x1',e2b.x);l2.setAttribute('y1',e2b.y);l2.setAttribute('x2',e2.x);l2.setAttribute('y2',e2.y);h.setAttribute('cx',p.x);h.setAttribute('cy',p.y);hh.setAttribute('cx',p.x);hh.setAttribute('cy',p.y);const deg=Math.round(Math.abs(t*180/Math.PI));a1.setAttribute('d',arc(0,t,70));a2.setAttribute('d',arc(Math.PI,opp,70));m1.textContent=deg+'°';m2.textContent=deg+'°'}function pt(e){const r=svg.getBoundingClientRect();return{x:(e.clientX-r.left)*900/r.width,y:(e.clientY-r.top)*430/r.height}}hh.addEventListener('pointerdown',e=>{drag=true;h.classList.add('selected');svg.setPointerCapture?.(e.pointerId)});svg.addEventListener('pointermove',e=>{if(!drag)return;const q=pt(e);if(Math.hypot(q.x-O.x,q.y-O.y)>85){p=q;draw()}});svg.addEventListener('pointerup',()=>{drag=false;h.classList.remove('selected')});svg.addEventListener('pointercancel',()=>{drag=false;h.classList.remove('selected')});document.getElementById('show').onclick=()=>document.getElementById('statement').hidden=!document.getElementById('statement').hidden;draw();</script></body></html>

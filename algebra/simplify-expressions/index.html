<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Simplify Expressions</title>
<style>
  :root{
    --bg:#ffffff;
    --text:#101010;
    --muted:#666;
    --line:#d9d9d9;
    --button:#f1f1f1;
    --button-hover:#e6e6e6;
    --answer:#0a66ff;
    --accent:#111;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
  body{min-height:100dvh;overflow-x:hidden}
  button{font:inherit}

  .app{
    min-height:100dvh;
    display:grid;
    grid-template-rows:auto 1fr auto;
    padding:clamp(12px,2vw,28px);
    gap:clamp(10px,1.5vw,20px);
  }

  .topbar{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .title-wrap{min-width:0;flex:1}
  h1{
    margin:0;
    font-size:clamp(30px,4.5vw,70px);
    line-height:1;
    font-weight:700;
    letter-spacing:-0.03em;
  }
  .subtitle{
    margin-top:8px;
    font-size:clamp(16px,2vw,28px);
    color:var(--muted);
  }
  .counter{
    font-size:clamp(14px,1.5vw,20px);
    color:var(--muted);
    white-space:nowrap;
  }
  .icon-btn{
    border:1px solid #aaa;
    background:#fff;
    border-radius:12px;
    min-width:50px;
    min-height:50px;
    padding:10px 14px;
    cursor:pointer;
  }
  .icon-btn:hover{background:#f7f7f7}

  .questions{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:clamp(12px,2vw,28px) clamp(24px,4vw,70px);
    align-content:center;
    width:min(1500px,100%);
    margin:0 auto;
  }
  .q{
    display:grid;
    grid-template-columns:auto minmax(0,1fr) minmax(135px,0.44fr);
    align-items:center;
    gap:clamp(10px,1.4vw,22px);
    min-height:clamp(90px,12vh,150px);
  }
  .q-num{
    font-size:clamp(24px,3vw,48px);
    color:#222;
    font-variant-numeric:tabular-nums;
  }
  .expr{
    font-family:"Times New Roman",Times,serif;
    font-size:clamp(32px,4.3vw,68px);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .var{font-style:italic}
  .answer-btn,
  .answer-box{
    width:100%;
    min-height:clamp(58px,7vw,88px);
    border-radius:8px;
    border:2px solid #888;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:8px 12px;
    font-size:clamp(20px,2.4vw,38px);
  }
  .answer-btn{
    background:var(--button);
    color:#777;
    cursor:pointer;
  }
  .answer-btn:hover{background:var(--button-hover)}
  .answer-box{
    background:#fff;
    color:var(--answer);
    font-family:"Comic Sans MS","Segoe Print",cursive;
    font-weight:700;
  }

  .footer{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    gap:12px;
    width:min(1500px,100%);
    margin:0 auto;
  }
  .nav-left{justify-self:start}
  .nav-right{justify-self:end}
  .nav-group{display:flex;gap:10px;flex-wrap:wrap}
  .btn{
    border:1px solid #888;
    background:#f3f3f3;
    border-radius:10px;
    padding:12px 18px;
    cursor:pointer;
    font-weight:700;
    min-height:48px;
  }
  .btn:hover{background:#e9e9e9}
  .btn.primary{background:#111;color:#fff;border-color:#111}
  .btn.primary:hover{background:#333}
  .btn:disabled{opacity:.35;cursor:not-allowed}
  .level-name{
    text-align:center;
    font-size:clamp(15px,1.7vw,22px);
    color:var(--muted);
    font-weight:700;
  }

  .presentation-mode{
    position:fixed !important;
    inset:0 !important;
    z-index:999999 !important;
    background:#fff !important;
    width:100vw !important;
    height:100dvh !important;
    overflow:auto !important;
  }

  @media (max-width: 900px){
    .questions{grid-template-columns:1fr;align-content:start}
    .q{min-height:86px;grid-template-columns:auto minmax(0,1fr) minmax(110px,0.38fr)}
    .expr{font-size:clamp(30px,7vw,50px)}
    .footer{grid-template-columns:1fr 1fr}
    .level-name{grid-column:1/-1;grid-row:1}
    .nav-left{grid-column:1;grid-row:2}
    .nav-right{grid-column:2;grid-row:2}
    h1{font-size:clamp(30px,8vw,52px)}
    .subtitle{font-size:clamp(15px,4vw,22px)}
  }

  @media (max-width: 560px){
    .app{padding:12px}
    .topbar{align-items:flex-start;flex-wrap:wrap}
    .counter{order:3;width:100%}
    .q{grid-template-columns:auto minmax(0,1fr);gap:8px 12px}
    .answer-btn,.answer-box{grid-column:2;min-height:50px;font-size:24px}
    .expr{font-size:clamp(28px,9vw,42px)}
    .q-num{font-size:26px}
    .footer{display:flex;flex-wrap:wrap;justify-content:space-between}
    .level-name{order:-1;width:100%}
    .btn{padding:10px 14px}
  }
</style>
</head>
<body>
<main id="app" class="app">
  <header class="topbar">
    <div class="title-wrap">
      <h1>Simplify expressions</h1>
      <div class="subtitle">Collect like terms.</div>
    </div>
    <div id="counter" class="counter"></div>
    <button id="fullscreenBtn" class="icon-btn" type="button" title="Full screen" aria-label="Full screen">⛶</button>
  </header>

  <section id="questions" class="questions" aria-live="polite"></section>

  <footer class="footer">
    <div class="nav-left nav-group">
      <button id="prevBtn" class="btn" type="button">← Previous</button>
      <button id="resetBtn" class="btn" type="button">Reset answers</button>
    </div>
    <div id="levelName" class="level-name"></div>
    <div class="nav-right nav-group">
      <button id="revealAllBtn" class="btn" type="button">Show all</button>
      <button id="nextBtn" class="btn primary" type="button">Next →</button>
    </div>
  </footer>
</main>

<script>
const slides = [
  {
    name: "Repeated variables",
    questions: [
      ["x + x + x", "3x"],
      ["a + a", "2a"],
      ["m + m + m + m", "4m"],
      ["p + p + p + p + p", "5p"],
      ["y + y + y + y + y + y", "6y"],
      ["t + t + t", "3t"]
    ]
  },
  {
    name: "Positive coefficients",
    questions: [
      ["2x + 4x", "6x"],
      ["3a + 5a", "8a"],
      ["2m + 3m + 4m", "9m"],
      ["7p + 2p", "9p"],
      ["4y + 5y + 2y", "11y"],
      ["6t + t + 3t", "10t"]
    ]
  },
  {
    name: "Like terms and constants",
    questions: [
      ["2x + 3x + 7 + 9", "5x + 16"],
      ["4a + 2 + 3a + 5", "7a + 7"],
      ["6m + 4 + 2m + 3", "8m + 7"],
      ["p + 8 + 5p + 2", "6p + 10"],
      ["3y + 7 + 4y + 6", "7y + 13"],
      ["5t + 1 + 2t + 9", "7t + 10"]
    ]
  },
  {
    name: "Two variables",
    questions: [
      ["2x + 3y + 4x + y", "6x + 4y"],
      ["5a + 2b + a + 6b", "6a + 8b"],
      ["3m + n + 2m + 4n", "5m + 5n"],
      ["p + 7q + 5p + 2q", "6p + 9q"],
      ["4x + 3y + x + 2y", "5x + 5y"],
      ["6a + b + 2a + 5b", "8a + 6b"]
    ]
  },
  {
    name: "Mixed order",
    questions: [
      ["3x + 4 + 2y + 5x + 7 + y", "8x + 3y + 11"],
      ["2a + 6b + 3 + 4a + b + 5", "6a + 7b + 8"],
      ["m + 7 + 3n + 5m + 2 + n", "6m + 4n + 9"],
      ["4p + q + 8 + 2p + 5q + 1", "6p + 6q + 9"],
      ["2x + 5y + 6 + 3x + y + 4", "5x + 6y + 10"],
      ["7a + 2 + b + a + 3b + 6", "8a + 4b + 8"]
    ]
  },
  {
    name: "Subtraction",
    questions: [
      ["7x − 3x", "4x"],
      ["9a − 2a + a", "8a"],
      ["8m + 3 − 5m + 4", "3m + 7"],
      ["10p − 4p + 2 − 7", "6p − 5"],
      ["6y − y + 8 − 3", "5y + 5"],
      ["12t − 5t − 2t", "5t"]
    ]
  },
  {
    name: "Powers are different terms",
    questions: [
      ["3x² + 2x²", "5x²"],
      ["4x² + 3x + 2x² + x", "6x² + 4x"],
      ["2a² + 5a + 3a² + a", "5a² + 6a"],
      ["m² + 4m + 3m² + 2m", "4m² + 6m"],
      ["5y² + 2 + y² + 7", "6y² + 9"],
      ["2t³ + t + 4t³ + 3t", "6t³ + 4t"]
    ]
  },
  {
    name: "Challenge mix",
    questions: [
      ["5x² + 3x − 2x² + 4x + 6", "3x² + 7x + 6"],
      ["7a + 2b − 3a + 5b − 4", "4a + 7b − 4"],
      ["4m² + 2m + 3 − m² + 5m + 6", "3m² + 7m + 9"],
      ["9p − 2q − 4p + 5q + 1", "5p + 3q + 1"],
      ["6x² − x + 4 − 2x² + 5x − 7", "4x² + 4x − 3"],
      ["3a² + 2a + b + a² − 5a + 4b", "4a² − 3a + 5b"]
    ]
  }
];

let slideIndex = 0;
let revealed = new Set();

const questionsEl = document.getElementById('questions');
const counterEl = document.getElementById('counter');
const levelNameEl = document.getElementById('levelName');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const resetBtn = document.getElementById('resetBtn');
const revealAllBtn = document.getElementById('revealAllBtn');
const fullscreenBtn = document.getElementById('fullscreenBtn');
const appEl = document.getElementById('app');

function mathHTML(text){
  return text
    .replace(/([A-Za-z])/g, '<span class="var">$1</span>')
    .replace(/²/g,'<sup>2</sup>')
    .replace(/³/g,'<sup>3</sup>');
}

function render(){
  const slide = slides[slideIndex];
  counterEl.textContent = `Page ${slideIndex + 1} of ${slides.length}`;
  levelNameEl.textContent = slide.name;
  questionsEl.innerHTML = '';

  slide.questions.forEach((q, i) => {
    const row = document.createElement('div');
    row.className = 'q';

    const num = document.createElement('div');
    num.className = 'q-num';
    num.textContent = `${i+1})`;

    const expr = document.createElement('div');
    expr.className = 'expr';
    expr.innerHTML = mathHTML(q[0]);

    let ans;
    if(revealed.has(i)){
      ans = document.createElement('div');
      ans.className = 'answer-box';
      ans.innerHTML = mathHTML(q[1]);
      ans.setAttribute('role','button');
      ans.setAttribute('tabindex','0');
      ans.title = 'Hide answer';
      ans.addEventListener('click',()=>{revealed.delete(i); render();});
      ans.addEventListener('keydown',(e)=>{if(e.key==='Enter'||e.key===' '){e.preventDefault(); revealed.delete(i); render();}});
    }else{
      ans = document.createElement('button');
      ans.className = 'answer-btn';
      ans.type = 'button';
      ans.textContent = 'Answer';
      ans.addEventListener('click',()=>{revealed.add(i); render();});
    }

    row.append(num,expr,ans);
    questionsEl.appendChild(row);
  });

  prevBtn.disabled = slideIndex === 0;
  nextBtn.textContent = slideIndex === slides.length - 1 ? 'Start again ↻' : 'Next →';
  revealAllBtn.textContent = revealed.size === slide.questions.length ? 'Hide all' : 'Show all';
}

prevBtn.addEventListener('click',()=>{
  if(slideIndex>0){ slideIndex--; revealed.clear(); render(); }
});
nextBtn.addEventListener('click',()=>{
  slideIndex = (slideIndex + 1) % slides.length;
  revealed.clear();
  render();
});
resetBtn.addEventListener('click',()=>{ revealed.clear(); render(); });
revealAllBtn.addEventListener('click',()=>{
  const n = slides[slideIndex].questions.length;
  if(revealed.size === n) revealed.clear();
  else revealed = new Set(Array.from({length:n},(_,i)=>i));
  render();
});

function isNativeFullscreen(){
  return document.fullscreenElement || document.webkitFullscreenElement;
}
async function toggleFullscreen(){
  try{
    if(isNativeFullscreen()){
      if(document.exitFullscreen) await document.exitFullscreen();
      else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
      return;
    }
    if(appEl.requestFullscreen){ await appEl.requestFullscreen(); return; }
    if(appEl.webkitRequestFullscreen){ appEl.webkitRequestFullscreen(); return; }
  }catch(e){ }
  appEl.classList.toggle('presentation-mode');
  fullscreenBtn.textContent = appEl.classList.contains('presentation-mode') ? '✕' : '⛶';
}
fullscreenBtn.addEventListener('click',toggleFullscreen);

document.addEventListener('fullscreenchange',()=>{
  fullscreenBtn.textContent = isNativeFullscreen() ? '✕' : '⛶';
});
document.addEventListener('webkitfullscreenchange',()=>{
  fullscreenBtn.textContent = isNativeFullscreen() ? '✕' : '⛶';
});

document.addEventListener('keydown',(e)=>{
  if(e.key==='ArrowRight'){ nextBtn.click(); }
  else if(e.key==='ArrowLeft' && !prevBtn.disabled){ prevBtn.click(); }
  else if(e.key.toLowerCase()==='f'){ fullscreenBtn.click(); }
  else if(e.key.toLowerCase()==='a'){
    const n = slides[slideIndex].questions.length;
    if(revealed.size === n) revealed.clear();
    else revealed = new Set(Array.from({length:n},(_,i)=>i));
    render();
  }
});

render();
</script>
</body>
</html>

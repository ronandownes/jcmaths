<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Simplify Expressions — JC Maths</title>
<link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
<link rel="stylesheet" href="../../assets/site.css">
<script defer src="../../assets/site-nav.js"></script>
<style>
  :root{--bg:#fff;--text:#101010;--muted:#666;--line:#d9d9d9;--button:#f1f1f1;--button-hover:#e6e6e6;--answer:#0a66ff;--correct:#147a3d;--correct-bg:#e9f8ee;--wrong:#a72b2b;--wrong-bg:#fff0f0;--almost:#8a5a00;--almost-bg:#fff7dd}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}body{min-height:100dvh;overflow-x:hidden}button,input{font:inherit}
  .app{min-height:calc(100dvh - 64px);display:grid;grid-template-rows:auto 1fr auto;padding:clamp(12px,2vw,28px);gap:clamp(10px,1.5vw,20px)}
  .topbar{display:flex;align-items:center;gap:12px}.title-wrap{min-width:0;flex:1}h1{margin:0;font-size:clamp(30px,4.5vw,70px);line-height:1;font-weight:700;letter-spacing:-.03em}.subtitle{margin-top:8px;font-size:clamp(16px,2vw,28px);color:var(--muted)}.counter{font-size:clamp(14px,1.5vw,20px);color:var(--muted);white-space:nowrap}.icon-btn{border:1px solid #aaa;background:#fff;border-radius:12px;min-width:50px;min-height:50px;padding:10px 14px;cursor:pointer}.icon-btn:hover{background:#f7f7f7}
  .questions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(10px,1.6vw,22px) clamp(20px,3vw,52px);align-content:center;width:min(1500px,100%);margin:0 auto}.q{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(245px,.85fr);align-items:center;gap:clamp(8px,1.2vw,18px);min-height:clamp(104px,13vh,158px)}.q-num{font-size:clamp(22px,2.6vw,42px);color:#222;font-variant-numeric:tabular-nums}.expr{font-family:"Times New Roman",Times,serif;font-size:clamp(30px,3.8vw,60px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.var{font-style:italic}
  .response-card{border:2px solid #929292;border-radius:10px;padding:8px;background:#fff;transition:border-color .15s ease,background .15s ease}.response-card.correct{border-color:var(--correct);background:var(--correct-bg)}.response-card.wrong{border-color:var(--wrong);background:var(--wrong-bg)}.response-card.almost{border-color:#c18a19;background:var(--almost-bg)}.response-card.prompt{border-color:#ad7a13;background:#fffaf0}.answer-input{width:100%;min-height:46px;border:1px solid #aeb4bc;border-radius:7px;background:#fff;padding:7px 10px;font-family:"Times New Roman",Times,serif;font-size:clamp(20px,2vw,30px);text-align:center;color:#111}.answer-input:focus{outline:3px solid #b9d4f3;outline-offset:1px;border-color:#4f82bd}.response-card.correct .answer-input{border-color:var(--correct);background:#f7fff9}.response-actions{display:flex;gap:7px;margin-top:7px}.check-btn,.show-btn{min-height:38px;border-radius:7px;padding:6px 10px;cursor:pointer;font-weight:800;flex:1}.check-btn{border:1px solid #111;background:#111;color:#fff}.check-btn:hover{background:#333}.show-btn{border:1px solid #9aa2ac;background:#f2f3f5;color:#333}.show-btn:hover{background:#e7e9ec}.feedback{min-height:22px;margin-top:5px;text-align:center;font-size:.86rem;font-weight:850;line-height:1.2}.response-card.correct .feedback{color:var(--correct)}.response-card.wrong .feedback{color:var(--wrong)}.response-card.almost .feedback,.response-card.prompt .feedback{color:var(--almost)}.revealed-answer{margin-top:7px;border-radius:7px;background:#eef5ff;padding:7px 9px;text-align:center;color:var(--answer);font-family:"Comic Sans MS","Segoe Print",cursive;font-size:clamp(18px,1.7vw,26px);font-weight:700}
  .footer{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;width:min(1500px,100%);margin:0 auto}.nav-left{justify-self:start}.nav-right{justify-self:end}.nav-group{display:flex;gap:10px;flex-wrap:wrap}.btn{border:1px solid #888;background:#f3f3f3;border-radius:10px;padding:12px 18px;cursor:pointer;font-weight:700;min-height:48px}.btn:hover{background:#e9e9e9}.btn.primary{background:#111;color:#fff;border-color:#111}.btn.primary:hover{background:#333}.btn:disabled{opacity:.35;cursor:not-allowed}.level-name{text-align:center;font-size:clamp(15px,1.7vw,22px);color:var(--muted);font-weight:700}
  .presentation-mode{position:fixed!important;inset:0!important;z-index:999999!important;background:#fff!important;width:100vw!important;height:100dvh!important;min-height:100dvh!important;overflow:auto!important}.app:fullscreen{min-height:100dvh}.app:-webkit-full-screen{min-height:100dvh}
  @media(max-width:1050px){.questions{grid-template-columns:1fr;align-content:start}.q{min-height:98px;grid-template-columns:auto minmax(0,1fr) minmax(250px,.7fr)}.expr{font-size:clamp(30px,6vw,52px)}}
  @media(max-width:700px){.app{min-height:calc(100dvh - 58px);padding:12px}.topbar{align-items:flex-start;flex-wrap:wrap}.counter{order:3;width:100%}.q{grid-template-columns:auto minmax(0,1fr);gap:8px 12px;padding:7px 0}.response-card{grid-column:2}.expr{font-size:clamp(28px,9vw,42px)}.q-num{font-size:26px}.footer{display:flex;flex-wrap:wrap;justify-content:space-between}.level-name{order:-1;width:100%}.btn{padding:10px 14px}.response-actions{flex-direction:row}}
  @media(max-width:430px){.response-actions{flex-direction:column}.check-btn,.show-btn{width:100%}}
</style>
</head>
<body>
<header class="site-shell" data-site-nav data-area="algebra"></header>
<main id="app" class="app">
  <header class="topbar">
    <div class="title-wrap"><h1>Simplify expressions</h1><div class="subtitle">Collect like terms.</div></div>
    <div id="counter" class="counter"></div>
    <button id="fullscreenBtn" class="icon-btn" type="button" title="Full screen" aria-label="Full screen">⛶</button>
  </header>
  <section id="questions" class="questions" aria-live="polite"></section>
  <footer class="footer">
    <div class="nav-left nav-group"><button id="prevBtn" class="btn" type="button">← Previous</button><button id="resetBtn" class="btn" type="button">Reset answers</button></div>
    <div id="levelName" class="level-name"></div>
    <div class="nav-right nav-group"><button id="revealAllBtn" class="btn" type="button">Show all</button><button id="nextBtn" class="btn primary" type="button">Next →</button></div>
  </footer>
</main>
<script>
const slides=[
{name:"Repeated variables",questions:[["x + x + x","3x"],["a + a","2a"],["m + m + m + m","4m"],["p + p + p + p + p","5p"],["y + y + y + y + y + y","6y"],["t + t + t","3t"]]},
{name:"Positive coefficients",questions:[["2x + 4x","6x"],["3a + 5a","8a"],["2m + 3m + 4m","9m"],["7p + 2p","9p"],["4y + 5y + 2y","11y"],["6t + t + 3t","10t"]]},
{name:"Like terms and constants",questions:[["2x + 3x + 7 + 9","5x + 16"],["4a + 2 + 3a + 5","7a + 7"],["6m + 4 + 2m + 3","8m + 7"],["p + 8 + 5p + 2","6p + 10"],["3y + 7 + 4y + 6","7y + 13"],["5t + 1 + 2t + 9","7t + 10"]]},
{name:"Two variables",questions:[["2x + 3y + 4x + y","6x + 4y"],["5a + 2b + a + 6b","6a + 8b"],["3m + n + 2m + 4n","5m + 5n"],["p + 7q + 5p + 2q","6p + 9q"],["4x + 3y + x + 2y","5x + 5y"],["6a + b + 2a + 5b","8a + 6b"]]},
{name:"Mixed order",questions:[["3x + 4 + 2y + 5x + 7 + y","8x + 3y + 11"],["2a + 6b + 3 + 4a + b + 5","6a + 7b + 8"],["m + 7 + 3n + 5m + 2 + n","6m + 4n + 9"],["4p + q + 8 + 2p + 5q + 1","6p + 6q + 9"],["2x + 5y + 6 + 3x + y + 4","5x + 6y + 10"],["7a + 2 + b + a + 3b + 6","8a + 4b + 8"]]},
{name:"Subtraction",questions:[["7x − 3x","4x"],["9a − 2a + a","8a"],["8m + 3 − 5m + 4","3m + 7"],["10p − 4p + 2 − 7","6p − 5"],["6y − y + 8 − 3","5y + 5"],["12t − 5t − 2t","5t"]]},
{name:"Powers are different terms",questions:[["3x² + 2x²","5x²"],["4x² + 3x + 2x² + x","6x² + 4x"],["2a² + 5a + 3a² + a","5a² + 6a"],["m² + 4m + 3m² + 2m","4m² + 6m"],["5y² + 2 + y² + 7","6y² + 9"],["2t³ + t + 4t³ + 3t","6t³ + 4t"]]},
{name:"Challenge mix",questions:[["5x² + 3x − 2x² + 4x + 6","3x² + 7x + 6"],["7a + 2b − 3a + 5b − 4","4a + 7b − 4"],["4m² + 2m + 3 − m² + 5m + 6","3m² + 7m + 9"],["9p − 2q − 4p + 5q + 1","5p + 3q + 1"],["6x² − x + 4 − 2x² + 5x − 7","4x² + 4x − 3"],["3a² + 2a + b + a² − 5a + 4b","4a² − 3a + 5b"]]}
];
let slideIndex=0;let revealed=new Set();let responses=new Map();
const questionsEl=document.getElementById('questions'),counterEl=document.getElementById('counter'),levelNameEl=document.getElementById('levelName'),prevBtn=document.getElementById('prevBtn'),nextBtn=document.getElementById('nextBtn'),resetBtn=document.getElementById('resetBtn'),revealAllBtn=document.getElementById('revealAllBtn'),fullscreenBtn=document.getElementById('fullscreenBtn'),appEl=document.getElementById('app');
function mathHTML(text){return text.replace(/([A-Za-z])/g,'<span class="var">$1</span>').replace(/²/g,'<sup>2</sup>').replace(/³/g,'<sup>3</sup>')}
function normaliseInput(text){return text.trim().replace(/[−–—]/g,'-').replace(/²/g,'^2').replace(/³/g,'^3').replace(/[·×]/g,'*').replace(/\s+/g,'').toLowerCase()}
function parseExpression(text){
  let s=normaliseInput(text);if(!s)return null;if(!/^[+\-]/.test(s))s='+'+s;const terms=s.match(/[+\-][^+\-]+/g);if(!terms||terms.join('')!==s)return null;const map=new Map();let rawTerms=0;
  for(const signed of terms){let sign=signed[0]==='-'?-1:1;let body=signed.slice(1).replace(/\*/g,'');if(!body)return null;rawTerms++;let m=body.match(/^(\d+(?:\.\d+)?)?(.*)$/);if(!m)return null;let coeff=m[1]?Number(m[1]):1;let vars=m[2];if(!Number.isFinite(coeff))return null;let key='1';if(vars){let factors=[];let pos=0;while(pos<vars.length){let fm=vars.slice(pos).match(/^([a-z])(?:\^(\d+))?/);if(!fm)return null;factors.push([fm[1],fm[2]?Number(fm[2]):1]);pos+=fm[0].length}const powers={};for(const [v,p] of factors)powers[v]=(powers[v]||0)+p;key=Object.keys(powers).sort().map(v=>powers[v]===1?v:`${v}^${powers[v]}`).join('*')}
    map.set(key,(map.get(key)||0)+sign*coeff);
  }
  for(const [k,v] of [...map])if(Math.abs(v)<1e-10)map.delete(k);return{map,rawTerms,simplifiedTerms:map.size};
}
function mapsEqual(a,b){if(!a||!b||a.size!==b.size)return false;for(const [k,v] of a){if(!b.has(k)||Math.abs(v-b.get(k))>1e-10)return false}return true}
function checkAnswer(value,expected){if(!value.trim())return{status:'prompt',message:'Enter an answer first.'};const got=parseExpression(value),want=parseExpression(expected);if(!got)return{status:'wrong',message:'Check the format and try again.'};if(!mapsEqual(got.map,want.map))return{status:'wrong',message:'Not yet — try again.'};if(got.rawTerms>got.simplifiedTerms)return{status:'almost',message:'Equivalent — now combine like terms.'};return{status:'correct',message:'✓ Correct'}}
function render(){
  const slide=slides[slideIndex];counterEl.textContent=`Page ${slideIndex+1} of ${slides.length}`;levelNameEl.textContent=slide.name;questionsEl.innerHTML='';
  slide.questions.forEach((q,i)=>{
    const state=responses.get(i)||{value:'',status:'',message:''};const row=document.createElement('div');row.className='q';
    const num=document.createElement('div');num.className='q-num';num.textContent=`${i+1})`;const expr=document.createElement('div');expr.className='expr';expr.innerHTML=mathHTML(q[0]);
    const card=document.createElement('div');card.className=`response-card${state.status?' '+state.status:''}`;const input=document.createElement('input');input.className='answer-input';input.type='text';input.autocomplete='off';input.spellcheck=false;input.placeholder='Your answer';input.value=state.value;input.setAttribute('aria-label',`Answer to question ${i+1}`);
    const actions=document.createElement('div');actions.className='response-actions';const check=document.createElement('button');check.className='check-btn';check.type='button';check.textContent='Check';const show=document.createElement('button');show.className='show-btn';show.type='button';show.textContent=revealed.has(i)?'Hide answer':'Show answer';const feedback=document.createElement('div');feedback.className='feedback';feedback.textContent=state.message;
    input.addEventListener('input',()=>{const current=responses.get(i)||{};responses.set(i,{...current,value:input.value,status:'',message:''});card.className='response-card';feedback.textContent=''});
    const runCheck=()=>{const result=checkAnswer(input.value,q[1]);responses.set(i,{value:input.value,...result});render();requestAnimationFrame(()=>{const inputs=questionsEl.querySelectorAll('.answer-input');if(inputs[i])inputs[i].focus()})};
    check.addEventListener('click',runCheck);input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();runCheck()}});show.addEventListener('click',()=>{revealed.has(i)?revealed.delete(i):revealed.add(i);render()});actions.append(check,show);card.append(input,actions,feedback);
    if(revealed.has(i)){const reveal=document.createElement('div');reveal.className='revealed-answer';reveal.innerHTML=`Answer: ${mathHTML(q[1])}`;card.appendChild(reveal)}
    row.append(num,expr,card);questionsEl.appendChild(row);
  });
  prevBtn.disabled=slideIndex===0;nextBtn.textContent=slideIndex===slides.length-1?'Start again ↻':'Next →';revealAllBtn.textContent=revealed.size===slide.questions.length?'Hide all':'Show all';
}
function clearPage(){revealed.clear();responses.clear()}
prevBtn.addEventListener('click',()=>{if(slideIndex>0){slideIndex--;clearPage();render()}});nextBtn.addEventListener('click',()=>{slideIndex=(slideIndex+1)%slides.length;clearPage();render()});resetBtn.addEventListener('click',()=>{clearPage();render()});revealAllBtn.addEventListener('click',()=>{const n=slides[slideIndex].questions.length;if(revealed.size===n)revealed.clear();else revealed=new Set(Array.from({length:n},(_,i)=>i));render()});
function isNativeFullscreen(){return document.fullscreenElement||document.webkitFullscreenElement}
async function toggleFullscreen(){try{if(isNativeFullscreen()){if(document.exitFullscreen)await document.exitFullscreen();else if(document.webkitExitFullscreen)document.webkitExitFullscreen();return}if(appEl.requestFullscreen){await appEl.requestFullscreen();return}if(appEl.webkitRequestFullscreen){appEl.webkitRequestFullscreen();return}}catch(e){}appEl.classList.toggle('presentation-mode');fullscreenBtn.textContent=appEl.classList.contains('presentation-mode')?'✕':'⛶'}
fullscreenBtn.addEventListener('click',toggleFullscreen);document.addEventListener('fullscreenchange',()=>{fullscreenBtn.textContent=isNativeFullscreen()?'✕':'⛶'});document.addEventListener('webkitfullscreenchange',()=>{fullscreenBtn.textContent=isNativeFullscreen()?'✕':'⛶'});
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,[contenteditable="true"]'))return;if(e.key==='ArrowRight')nextBtn.click();else if(e.key==='ArrowLeft'&&!prevBtn.disabled)prevBtn.click();else if(e.key.toLowerCase()==='f')fullscreenBtn.click();else if(e.key.toLowerCase()==='a')revealAllBtn.click()});
render();
</script>
</body>
</html>

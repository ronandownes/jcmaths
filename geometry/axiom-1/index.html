<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Axiom 1 — JC Maths</title><link rel="stylesheet" href="../../assets/site.css"><style>body{margin:0;background:#f5f7fa;color:#202936;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:980px;margin:auto;padding:26px 18px 60px}h1{font-size:clamp(2.2rem,7vw,4.2rem);margin:.1em 0}.lead{font-size:1.15rem;line-height:1.55;color:#566070}.card{background:#fff;border:1px solid #c9d1dc;border-radius:10px;padding:18px;margin-top:16px}svg{width:100%;background:#fff;border:2px solid #c9d1dc;border-radius:10px;touch-action:none;user-select:none}.line{stroke:#202936;stroke-width:5}.geo-point{stroke:#111;stroke-width:3}.point-red{fill:#c62828}.point-green{fill:#2e7d32}.label{font-size:27px;font-weight:900;fill:#202936;paint-order:stroke;stroke:#fff;stroke-width:5px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}button{min-height:46px;padding:9px 13px;border:1px solid #c9d1dc;border-radius:9px;background:#fff;font:inherit;font-weight:800}.note{padding:12px 14px;background:#eef5ff;border-left:6px solid #1565c0;border-radius:8px;line-height:1.5}.math-statement{font-size:clamp(1.3rem,4vw,2rem);font-weight:850;line-height:1.4}</style></head><body><header class="site-shell"><div class="site-shell-inner"><a class="site-brand" href="../../index.html"><span class="site-logo" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span>JC Maths</span></a><nav class="site-nav"><a href="../../index.html">Home</a><a href="../">Geometry</a></nav></div></header><main><p>Axiom 1</p><h1>Two Points Axiom</h1><p class="lead">Click two distinct points in the plane. The line through them will appear.</p><div class="card"><svg id="board" viewBox="0 0 900 360"><line id="line" class="line" visibility="hidden"></line><circle id="a" class="geo-point point-red" r="13" visibility="hidden"></circle><circle id="b" class="geo-point point-green" r="13" visibility="hidden"></circle><text id="al" class="label" visibility="hidden">A</text><text id="bl" class="label" visibility="hidden">B</text></svg><div class="toolbar"><button id="reset">Reset</button><button id="show">Show axiom</button></div><div id="statement" class="note" hidden><strong>Axiom 1 — Two Points Axiom</strong><div class="math-statement">There is exactly one line through any two given points.</div><p>We denote the line through A and B by AB.</p></div></div></main><script>const svg=document.getElementById('board'),line=document.getElementById('line'),A=document.getElementById('a'),B=document.getElementById('b'),AL=document.getElementById('al'),BL=document.getElementById('bl');let pts=[];function p(e){const r=svg.getBoundingClientRect();return{x:(e.clientX-r.left)*900/r.width,y:(e.clientY-r.top)*360/r.height}}function extend(a,b){const dx=b.x-a.x,dy=b.y-a.y,h=[];for(const x of[0,900]){if(dx){const t=(x-a.x)/dx,y=a.y+t*dy;if(y>=0&&y<=360)h.push({x,y,t})}}for(const y of[0,360]){if(dy){const t=(y-a.y)/dy,x=a.x+t*dx;if(x>=0&&x<=900)h.push({x,y,t})}}h.sort((u,v)=>u.t-v.t);return[h[0],h[h.length-1]]}function draw(){if(pts[0]){A.setAttribute('cx',pts[0].x);A.setAttribute('cy',pts[0].y);A.setAttribute('visibility','visible');AL.setAttribute('x',pts[0].x+16);AL.setAttribute('y',pts[0].y-14);AL.setAttribute('visibility','visible')}if(pts[1]){B.setAttribute('cx',pts[1].x);B.setAttribute('cy',pts[1].y);B.setAttribute('visibility','visible');BL.setAttribute('x',pts[1].x+16);BL.setAttribute('y',pts[1].y-14);BL.setAttribute('visibility','visible');const e=extend(pts[0],pts[1]);line.setAttribute('x1',e[0].x);line.setAttribute('y1',e[0].y);line.setAttribute('x2',e[1].x);line.setAttribute('y2',e[1].y);line.setAttribute('visibility','visible')}}svg.addEventListener('click',e=>{if(pts.length>=2)return;const q=p(e);if(pts[0]&&Math.hypot(q.x-pts[0].x,q.y-pts[0].y)<35)return;pts.push(q);draw()});document.getElementById('reset').onclick=()=>{pts=[];[A,B,AL,BL,line].forEach(x=>x.setAttribute('visibility','hidden'));document.getElementById('statement').hidden=true};document.getElementById('show').onclick=()=>document.getElementById('statement').hidden=!document.getElementById('statement').hidden;</script></body></html>
